name: Deploy EYENEX NEURAL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site files
        run: |
          test -f index.html
          test -f assets/css/eyenex.css
          test -f assets/css/panel-scroll.css
          test -f assets/css/settings.css
          test -f assets/css/fixed-frame.css
          test -f assets/css/hud-layout.css
          test -f assets/js/eyenex.js
          test -f assets/css/multimodal.css
          test -f assets/js/multimodal.js
          node --check assets/js/multimodal.js
          echo "EYENEX NEURAL static files and multimodal JavaScript syntax are valid."

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
