name: Deploy EYENEX NEURAL to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate static site files
        run: |
          test -f index.html
          test -f assets/css/eyenex.css
          test -f assets/css/panel-scroll.css
          test -f assets/css/settings.css
          test -f assets/css/fixed-frame.css
          test -f assets/css/hud-layout.css
          test -f assets/js/eyenex.js
          test -f assets/css/multimodal.css
          test -f assets/js/multimodal.js
          test -f assets/js/project-intelligence.js
          test -f assets/css/hud-atmosphere.css
          test -f assets/js/hud-atmosphere.js
          test -f assets/js/mission-intelligence.js
          node --check assets/js/multimodal.js
          node --check assets/js/project-intelligence.js
          node --check assets/js/hud-atmosphere.js
          node --check assets/js/mission-intelligence.js
          echo "EYENEX NEURAL static files and JavaScript syntax are valid."

      - name: Prepare Pages artifact
        run: |
          if ! grep -q 'assets/css/hud-atmosphere.css' index.html; then
            sed -i 's#</head>#  <link rel="stylesheet" href="./assets/css/hud-atmosphere.css" />\\n</head>#' index.html
          fi
          if ! grep -q 'assets/js/mission-intelligence.js' index.html; then
            sed -i 's#</body>#  <script src="./assets/js/project-intelligence.js"></script>\\n  <script src="./assets/js/mission-vault.js"></script>\\n  <script src="./assets/js/hud-atmosphere.js"></script>\\n  <script src="./assets/js/mission-intelligence.js"></script>\\n</body>#' index.html
          fi
          grep -q 'assets/css/hud-atmosphere.css' index.html
          grep -q 'assets/js/project-intelligence.js' index.html
          grep -q 'assets/js/mission-vault.js' index.html
          grep -q 'assets/js/hud-atmosphere.js' index.html
          grep -q 'assets/js/mission-intelligence.js' index.html
          echo "Verified feature modules are referenced in the Pages artifact."
          
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
